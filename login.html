<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso y Registro | Hunter's Cattle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #1e222a;
            color: #0f172a;
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem 1rem;
        }
        .auth-card {
            width: 100%;
            max-width: 540px;
            background-color: #ffffff;
            border-radius: 18px;
            overflow: hidden;
            box-shadow: 0 24px 55px rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .auth-header {
            background-color: #0a007b;
            color: #ffffff;
            text-align: center;
            padding: 2rem 2.25rem;
            border-bottom: 3px solid #00c8ff;
        }
        .auth-body {
            padding: 2.25rem 2.5rem;
        }
        .tab-group {
            background-color: #0a007b;
            padding: 0.4rem;
            border-radius: 12px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.4rem;
            margin-bottom: 1.75rem;
        }
        .tab-btn {
            border: none;
            background: transparent;
            color: #d8dee9;
            font-size: 0.98rem;
            font-weight: 600;
            padding: 0.75rem 1rem;
            border-radius: 9px;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background-color: #00c8ff;
            color: #0f172a;
        }
        .form-label {
            font-size: 0.92rem;
            font-weight: 600;
            color: #1e293b;
        }
        .form-control {
            border: 1.5px solid #cbd5e1;
            border-radius: 10px;
            padding: 0.8rem 1rem;
        }
        .btn-ingresar,
        .btn-registrar {
            background: linear-gradient(135deg, #0055ff 0%, #0077ff 100%);
            color: #ffffff;
            font-weight: 600;
            padding: 0.85rem 1.25rem;
            border-radius: 10px;
            border: none;
        }
        .demo-box {
            background-color: #f1f5f9;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 0.75rem 1rem;
            color: #334155;
        }
    </style>
</head>
<body>

    <main class="auth-card">
        <div class="auth-header">
            <h1 class="h3 fw-bold mb-1">Hunter's Cattle</h1>
            <p class="small mb-0 opacity-75">Plataforma de Reproducción Ganadera</p>
        </div>

        <div class="auth-body">
            <div class="tab-group" role="tablist">
                <button type="button" id="tab-login" class="tab-btn active" role="tab" aria-selected="true">Iniciar Sesión</button>
                <button type="button" id="tab-registro" class="tab-btn" role="tab" aria-selected="false">Crear Cuenta</button>
            </div>

            <div id="mensaje-auth" aria-live="polite"></div>

            <form id="form-login">
                <div class="mb-3">
                    <label for="login-usuario" class="form-label">Usuario</label>
                    <input type="text" id="login-usuario" class="form-control" placeholder="Ej. us1 o admin" required>
                </div>
                <div class="mb-4">
                    <label for="login-password" class="form-label">Contraseña</label>
                    <input type="password" id="login-password" class="form-control" placeholder="Escribe tu contraseña" required>
                </div>
                <button type="submit" class="btn btn-ingresar w-100">Ingresar</button>
                <div class="demo-box text-center mt-4 small">
                    <strong>Administrador:</strong> admin / 123 &bull; <strong>Usuario final:</strong> us1 / 123
                </div>
            </form>

            <form id="form-registro" class="d-none">
                <div class="mb-3">
                    <label for="reg-nombre" class="form-label">Nombre Completo</label>
                    <input type="text" id="reg-nombre" class="form-control" placeholder="Ej. Jorge Parra" required>
                </div>
                <div class="mb-3">
                    <label for="reg-usuario" class="form-label">Nombre de Usuario</label>
                    <input type="text" id="reg-usuario" class="form-control" placeholder="Ej. jorge26" required>
                </div>
                <div class="row g-3 mb-4">
                    <div class="col-md-6">
                        <label for="reg-password" class="form-label">Contraseña</label>
                        <input type="password" id="reg-password" class="form-control" placeholder="Mínimo 3 caracteres" required>
                    </div>
                    <div class="col-md-6">
                        <label for="reg-confirmar" class="form-label">Confirmar Contraseña</label>
                        <input type="password" id="reg-confirmar" class="form-control" placeholder="Repite tu contraseña" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-registrar w-100">Registrarme como Usuario Final</button>
            </form>
        </div>
    </main>

    <script src="js/auth.js"></script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            inicializarUsuarios();

            if (obtenerSesionActiva()) {
                window.location.href = "index.html";
                return;
            }

            const tabLogin = document.getElementById("tab-login");
            const tabRegistro = document.getElementById("tab-registro");
            const formLogin = document.getElementById("form-login");
            const formRegistro = document.getElementById("form-registro");
            const mensajeBox = document.getElementById("mensaje-auth");

            function cambiarPestana(modo) {
                mensajeBox.innerHTML = "";
                if (modo === "login") {
                    tabLogin.classList.add("active");
                    tabLogin.setAttribute("aria-selected", "true");
                    tabRegistro.classList.remove("active");
                    tabRegistro.setAttribute("aria-selected", "false");
                    formLogin.classList.remove("d-none");
                    formRegistro.classList.add("d-none");
                } else {
                    tabRegistro.classList.add("active");
                    tabRegistro.setAttribute("aria-selected", "true");
                    tabLogin.classList.remove("active");
                    tabLogin.setAttribute("aria-selected", "false");
                    formRegistro.classList.remove("d-none");
                    formLogin.classList.add("d-none");
                }
            }

            tabLogin.addEventListener("click", () => cambiarPestana("login"));
            tabRegistro.addEventListener("click", () => cambiarPestana("registro"));

            formLogin.addEventListener("submit", (e) => {
                e.preventDefault();
                const usuario = document.getElementById("login-usuario").value;
                const password = document.getElementById("login-password").value;
                const res = iniciarSesionUsuario(usuario, password);

                if (res.ok) {
                    window.location.href = res.sesion.rol === "Administrador" ? "admin.html" : "index.html";
                } else {
                    mensajeBox.innerHTML = `<div class="alert alert-danger py-2 small">${res.mensaje}</div>`;
                }
            });

            formRegistro.addEventListener("submit", (e) => {
                e.preventDefault();
                const res = registrarUsuario({
                    nombreCompleto: document.getElementById("reg-nombre").value,
                    usuario: document.getElementById("reg-usuario").value,
                    password: document.getElementById("reg-password").value,
                    confirmarPassword: document.getElementById("reg-confirmar").value
                });

                if (res.ok) {
                    window.location.href = "index.html";
                } else {
                    mensajeBox.innerHTML = `<div class="alert alert-danger py-2 small">${res.mensaje}</div>`;
                }
            });
        });
    </script>
</body>
</html>
